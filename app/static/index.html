<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Vault</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230d0d0c'/><rect x='7' y='7' width='18' height='18' fill='none' stroke='%23f0efea' stroke-width='3'/><rect x='7' y='7' width='9' height='18' fill='%23f0efea'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="shell" class="hero">

    <header id="mast">
      <div class="mast-in">
        <a href="#/" id="wordmark" title="Home">
          <span class="mark"></span>
          <span class="word">Research Vault</span>
        </a>

        <div id="mast-tools">
          <button id="new-btn" class="btn btn-solid" title="New idea (N)">+ New Idea</button>
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input id="search" type="search" placeholder="Search ideas" autocomplete="off" spellcheck="false">
          </div>
        </div>

        <div id="mast-right"></div>
      </div>
    </header>

    <main id="main"></main>

    <footer id="foot">
      <div class="legend" id="legend"></div>
      <span class="grow"></span>
      <button id="tax-btn" class="btn btn-quiet btn-sm">Fields…</button>
      <button id="theme-btn" class="btn btn-quiet btn-sm" title="Toggle light / dark">◐</button>
    </footer>

  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
